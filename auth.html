<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f5"><title>Sign in — WA Studio</title><link rel="stylesheet" href="assets/css/style.css"><style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7f5}.auth-card{width:min(100%,440px);background:#fff;border:1px solid #e7ece8;border-radius:24px;padding:32px;box-shadow:0 18px 60px #183d2b12}.auth-brand{display:flex;align-items:center;gap:12px;font:800 22px Manrope,sans-serif;margin-bottom:28px}.auth-mark{width:42px;height:42px;border-radius:14px;background:#15965c;color:#fff;display:grid;place-items:center}.auth-card h1{font:800 28px Manrope,sans-serif;margin:0 0 8px}.auth-card p{color:#718078;margin:0 0 24px}.auth-card label{display:block;font-weight:600;margin:14px 0}.auth-card input{width:100%;margin-top:7px;padding:13px 14px;border:1px solid #dce5df;border-radius:12px;font:inherit}.auth-card .button{width:100%;justify-content:center;margin-top:12px}.auth-switch{margin-top:18px;text-align:center;color:#65746c}.auth-switch button{border:0;background:none;color:#12804f;font-weight:700;cursor:pointer}.auth-error{color:#b42318;font-size:13px;min-height:18px;margin-top:10px}.auth-note{font-size:12px;color:#7b8981;margin-top:18px}#otpField input{text-align:center;letter-spacing:.35em;font-size:22px;font-weight:700}#otpField[hidden],#passwordField[hidden],#otpHint[hidden],#resendOtp[hidden]{display:none!important}#resendOtp{border:0;background:none;color:#12804f;font-weight:700;cursor:pointer;padding:10px}
</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="auth-brand"><span class="auth-mark">✳</span><span>wa<span style="font-weight:500;color:#15965c">studio</span></span></div><h1 id="heading">Welcome back</h1><p id="subheading">Sign in to your secure workspace.</p><form id="authForm"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label id="passwordField">Password<input id="password" type="password" minlength="8" autocomplete="current-password" required placeholder="At least 8 characters"></label><label id="otpField" hidden>6-digit verification code<input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="Enter 6-digit code"></label><p id="otpHint" class="auth-note" hidden></p><button id="resendOtp" type="button" class="auth-switch" hidden>Resend code</button><button class="button button-primary" id="submitBtn" type="submit">Sign in</button><div class="auth-error" id="error" role="alert"></div></form><div class="auth-switch"><span id="switchText">New to WA Studio?</span> <button id="switchMode" type="button">Create account</button></div><div class="auth-note">Your workspace data is protected by Supabase authentication and row-level security.</div></section></main><script type="module" src="assets/js/auth.js"></script></body></html>
