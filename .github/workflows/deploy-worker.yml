name: Deploy WA Studio API Worker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment secret
        id: token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment skipped. Add CLOUDFLARE_API_TOKEN in repository Actions secrets, then run this workflow again."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.token.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Report deployment not configured
        if: steps.token.outputs.available != 'true'
        run: echo "No deployment was performed. Configure the CLOUDFLARE_API_TOKEN repository secret to enable deployment."
